version: 2

# ARI-3925. Security fixes come grouped: one PR for all the minor/patch fixes
# instead of one PR per vulnerable package. A security fix
# that needs a MAJOR bump keeps its own PR, to be reviewed first.
#
# Version updates are OFF (open-pull-requests-limit: 0): this repository has no
# required CI check, so nothing here can be auto-merged and every PR would
# wait for a human. Turn them on (copy the product-page-v2 config) once a CI
# check is required on the default branch.
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/permit721-sdk"
      - "/packages/wallet-api-client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
